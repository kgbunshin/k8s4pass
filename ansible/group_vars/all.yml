---
# ---- access ---------------------------------------------------------------------------
ckad_admin_user: deploy                       # the only account allowed to log in over SSH (key only)
ckad_admin_pubkey_file: "~/.ssh/id_ed25519.pub"   # public key on THIS machine that will be authorized
ssh_port: 22
ssh_allowed_cidrs: []                         # e.g. ["203.0.113.7/32"]; empty = SSH open to the world (rate limited + fail2ban)

# ---- web exposure ---------------------------------------------------------------------
ckad_http_port: 80
ckad_server_names: ["{{ inventory_hostname }}"]   # requests for any other Host header are dropped (444)
ckad_allowed_cidrs: []                        # e.g. ["203.0.113.0/24"]; empty = open to the world, but behind basic auth
ckad_basic_auth_user: student
ckad_basic_auth_password: "{{ vault_ckad_basic_auth_password }}"   # required, see vault.example.yml

# ---- application ----------------------------------------------------------------------
ckad_user: ckad                               # unprivileged service account: no shell, no SSH, rootless docker
ckad_app_dir: /opt/ckad-lab                   # code, owned by root and read-only for the service
ckad_data_dir: /var/lib/ckad-lab              # session records and per-session work dirs, owned by ckad
ckad_max_sessions: 2                          # each kind cluster needs ~1-1.5 GB of RAM (server has 7.8 GB)
ckad_session_minutes: 120
ckad_review_minutes: 30
ckad_smoke_test: true                         # create and delete a real kind cluster to prove rootless docker works

kind_version: v0.31.0
kubectl_version: v1.35.0                      # must match app/shell/Dockerfile and the kind node image

# ---- derived (do not edit) -------------------------------------------------------------
rootless_env:
  XDG_RUNTIME_DIR: "/run/user/{{ ckad_uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ckad_uid }}/bus"
  DOCKER_HOST: "unix:///run/user/{{ ckad_uid }}/docker.sock"
  PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
