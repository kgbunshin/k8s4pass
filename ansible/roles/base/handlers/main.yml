---
- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
